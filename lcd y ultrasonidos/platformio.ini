# Configuración específica del proyecto "lcd y ultrasonidos"
# Placa: Arduino UNO
# Sensores: Sensor ultrasónico HC-SR04, LCD 16x2

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

# Puerto serial - AJUSTA SEGÚN TU SISTEMA:
# Linux:
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

# Windows (descomenta si usas Windows):
# upload_port = COM3
# monitor_port = COM3

# macOS (descomenta si usas Mac):
# upload_port = /dev/cu.usbserial-*
# monitor_port = /dev/cu.usbserial-*

# Rutas de búsqueda para librerías locales
lib_extra_dirs = 
    ${PROJECTDIR}/../librerias

# Configuración de compilación
build_flags = -Wall

# Librerías necesarias para este proyecto
lib_deps = 
    arduino-libraries/LiquidCrystal@^1.0.7
